# Site settings. Restart `jekyll serve` after editing this file.

title: James Bowden
description: >-
  Senior Lecturer in Financial Technology at Strathclyde Business School.
  Research on financial text, voice and satellite data, and on the responsible
  use of AI in financial services.
url: "https://www.jwbowden.com"
baseurl: ""
lang: en-GB
timezone: Europe/London
logo: /images/profile.jpg
social:
  name: James Bowden
  links:
    - https://www.linkedin.com/in/james-bowden-51a28548/
    - https://github.com/iamjamesbowden
    - https://orcid.org/0000-0002-0419-1882

author:
  name: James Bowden
  email: james@jwbowden.com        # <- change here and it updates everywhere
  location: Glasgow, Scotland
  linkedin: https://www.linkedin.com/in/james-bowden-51a28548/
  github: https://github.com/iamjamesbowden
  scholar: https://scholar.google.com/citations?user=M6UaBy4AAAAJ
  orcid: https://orcid.org/0000-0002-0419-1882
  pure: https://pureportal.strath.ac.uk/en/persons/james-bowden/
  photo: /images/profile.jpg

# Blog
permalink: /blog/:year/:month/:title/
excerpt_separator: "<!--more-->"

# Build settings (all supported by GitHub Pages)
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
    values:
      image: /images/profile.jpg

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
