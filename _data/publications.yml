# To add an entry, copy an existing one and edit it. Fields:
#   title    - required
#   authors  - required. "Bowden, J." is picked out in bold automatically.
#   year     - required
#   venue    - journal, book or series (shown in italics)
#   details  - volume, issue, pages or article number
#   doi      - just the DOI, without https://doi.org/
#   url      - a link to use when there is no DOI
#   fulltext - link to a free copy (e.g. Strathprints)
#   featured - true to show it on the home page

